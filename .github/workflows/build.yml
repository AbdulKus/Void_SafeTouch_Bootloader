name: Сборка прошивки

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: AT91SAM7S64
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка ARM GNU Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Сборка загрузчика и примера
        run: chmod +x build.sh && ./build.sh

      - name: Публикация готовых образов
        uses: actions/upload-artifact@v7
        with:
          name: void-safevoid-firmware
          path: |
            void_recovery.bin
            void_bootloader.vbi
            examples/menu/menu.vbi
            examples/windows-login/windows-login.vbi

  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Конфигурация x64
        run: cmake -S windows -B windows/build -A x64

      - name: Сборка Release
        run: cmake --build windows/build --config Release --parallel

      - name: Публикация EXE и DLL
        uses: actions/upload-artifact@v7
        with:
          name: safevoid-setup-x64
          path: windows/build/Release/SafeVoidSetup.exe
